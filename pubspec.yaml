name: ai_vision
description: AI Vision - Real-time object detection powered by YOLOv8n
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  ultralytics_yolo: ^0.3.4
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.0
  provider: ^6.1.0
  google_fonts: ^6.2.0
  intl: ^0.19.0
  path_provider: ^2.1.0
  screenshot: ^3.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
